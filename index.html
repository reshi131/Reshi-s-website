<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reshi's Website | Red Kakashi</title>
<meta name="theme-color" content="#080204">
<meta name="description"
      content="Welcome to Reshi's Website — a cinematic red anime-inspired portfolio.">

<style>
:root {
    --red: #ff1638;

}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 100px;
}

body {
    background: var(--dark);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button, input {
    font: inherit;
}

/* BACKGROUND LAYERS */

#particleCanvas,
#lightningCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#particleCanvas {
    z-index: -3;
}

#lightningCanvas {
    z-index: -1;
}

.background {
    position: fixed;
    inset: 0;
    z-index: -4;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 78% 35%,
            rgba(255, 0, 35, .19),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 20% 70%,
            rgba(120, 0, 20, .20),
            transparent 40%
        ),
        linear-gradient(125deg, #020102, #180309 55%, #030102);
}

/* Optional Kakashi image:
   Upload kakashi.png into the same GitHub folder. */

.kakashi-art {
    position: fixed;
    z-index: -2;
    width: min(75vw, 1000px);
    height: 95vh;
    right: -8%;
    top: 4%;
    background-image: url("kakashi.png");
    background-position: center;
    background-size: contain;
    background-repeat: no-repeat;
    opacity: .48;
    filter: drop-shadow(0 0 35px rgba(255, 0, 35, .32));
    animation: artFloat 7s ease-in-out infinite;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 10%,
        black 75%,
        transparent 100%
    );
    mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 10%,
        black 75%,
        transparent 100%
    );
}

@keyframes artFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.015); }
}

/* Mouse-following light */

#mouseGlow {
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    background: radial-gradient(
        circle,
        rgba(255, 0, 35, .13),
        rgba(255, 0, 35, .04) 38%,
        transparent 70%
    );
    transform: translate(-50%, -50%);
    left: 50%;
    top: 50%;
}

/* RED FLASH */

.screen-flash {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background: rgba(255, 0, 35, .14);
    opacity: 0;
}

.screen-flash.flash {
    animation: flash 0.45s ease-out;
}

@keyframes flash {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
}

header {

    align-items: center;
    justify-content: space-between;

}

@keyframes energyMove {
